// Loads .env into rootProject.ext.envVars (does not override existing OS env vars).
def envFile = rootProject.file('.env')
rootProject.ext.envVars = [:]

if (envFile.exists()) {
    envFile.eachLine { line ->
        line = line.trim()
        if (line.isEmpty() || line.startsWith('#')) {
            return
        }
        def eq = line.indexOf('=')
        if (eq <= 0) {
            return
        }
        def key = line.substring(0, eq).trim()
        def value = line.substring(eq + 1).trim()
        if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
            value = value.substring(1, value.length() - 1)
        }
        rootProject.ext.envVars[key] = value
    }
}

rootProject.ext.env = { String key, String defaultValue = '' ->
    def fromOs = System.getenv(key)
    if (fromOs != null && !fromOs.isBlank()) {
        return fromOs
    }
    return rootProject.ext.envVars.get(key, defaultValue)
}

rootProject.ext.publishEnabled = {
    rootProject.env('PUBLISH_ENABLED', 'false').equalsIgnoreCase('true')
}
