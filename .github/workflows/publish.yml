# Automatischer Upload zu Modrinth und CurseForge bei GitHub Release.
#
# Repository-Secrets (Settings → Secrets and variables → Actions):
#   MODRINTH_TOKEN
#   MODRINTH_PROJECT_ID          (optional, Standard: better-death-screen)
#   CURSEFORGE_TOKEN             (optional)
#   CURSEFORGE_PROJECT_ID        (optional, numerische Projekt-ID)
#
# Beim Erstellen eines Releases optional den Body als CHANGELOG verwenden.

name: Publish mod

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      minecraft_target:
        description: 'Subproject (z. B. fabric-1.21.1 oder "all")'
        required: true
        default: 'all'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish all variants
        if: github.event_name == 'release' || inputs.minecraft_target == 'all'
        env:
          PUBLISH_ENABLED: 'true'
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          CHANGELOG: ${{ github.event.release.body || 'Automated release' }}
          RELEASE_TYPE: STABLE
        run: ./gradlew publishAll --no-daemon

      - name: Publish single variant
        if: github.event_name == 'workflow_dispatch' && inputs.minecraft_target != 'all'
        env:
          PUBLISH_ENABLED: 'true'
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          CHANGELOG: Manual workflow publish
          RELEASE_TYPE: STABLE
        run: ./gradlew :${{ inputs.minecraft_target }}:publishMods --no-daemon
